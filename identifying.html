<!DOCTYPE html>
<html>
<head>
    <title>Identifying</title>
    <link href="identifying.css" rel="stylesheet">
</head>
<body>

<h1>Identifying</h1>

<div class="test-container">
    <h2>Color Blindness Test</h2>
    <p id="question-text">What number do you see?</p>

    <img id="test-image" src="plate1.png" alt="Color test">

    <div class="answers" id="answers"></div>

    <p id="result"></p>
</div>

<script>
const questions = [
    {
        image: "ishihara12.png",
        correct: 12,
        options: [12, 8, 3]
    },
    {
        image: "ishihara8.png",
        correct: 8,
        options: [6, 8, 29]
    },
    {
        image: "ishihara29.png",
        correct: 29,
        options: [15, 29, 70]
    },
    {
        image: "ishihara5.png",
        correct: 5,
        options: [5, 2, 9]
    },
    {
        image: "ishihara3.png",
        correct: 3,
        options: [8, 3, 6]
    },
    {
        image: "ishihara15.png",
        correct: 15,
        options: [15, 17, 75]
    },
    {
        image: "ishihara74.png",
        correct: 74,
        options: [21, 74, 14]
    },
    {
        image: "ishihara45.png",
        correct: 45,
        options: [45, 54, 35]
    },
    {
        image: "ishihara7.png",
        correct: 7,
        options: [1, 7, 9]
    },
    {
        image: "ishihara26.png",
        correct: 26,
        options: [26, 62, 28]
    }
];

let currentQuestion = 0;
let score = 0;

function loadQuestion() {
    const q = questions[currentQuestion];

    document.getElementById("test-image").src = q.image;

    const answersDiv = document.getElementById("answers");
    answersDiv.innerHTML = "";

    q.options.forEach(option => {
        const btn = document.createElement("button");
        btn.textContent = option;
        btn.onclick = () => checkAnswer(option);
        answersDiv.appendChild(btn);
    });
}

function checkAnswer(answer) {
    if (answer === questions[currentQuestion].correct) {
        score++;
    }

    currentQuestion++;

    if (currentQuestion < questions.length) {
        loadQuestion();
    } else {
        showResult();
    }
}

function showResult() {
    const result = document.getElementById("result");

    if (score >= 9) {
        result.textContent = "Normal color vision.";
        result.style.color = "lightgreen";
    } else if (score >= 5) {
        result.textContent = "Slight indication of abnormal color vision.";
        result.style.color = "orange";
    } else {
        result.textContent =
            "Strong indication of abnormal color vision. Further assessment suggested.";
        result.style.color = "red";
    }

    document.getElementById("answers").innerHTML = "";
}

loadQuestion();
</script>
</body>
</html>
