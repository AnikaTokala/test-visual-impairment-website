<!DOCTYPE html>
<html>
<head>
    <title>MathReader</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>MathReader</h1>
</header>

<main>

<table>
  <tr>
    <th>Symbol</th>
    <th>Name</th>
  </tr>

  <tr>
    <td class="symbol">&plusmn;</td>
    <td>Plus Minus</td>
  </tr>

  <tr>
    <td class="symbol">&times;</td>
    <td>Multiplication</td>
  </tr>

  <tr>
    <td class="symbol">&divide;</td>
    <td>Division</td>
  </tr>

  <tr>
    <td class="symbol">&le;</td>
    <td>Less Than or Equal</td>
  </tr>

  <tr>
    <td class="symbol">&ge;</td>
    <td>Greater Than or Equal</td>
  </tr>

  <tr>
    <td class="symbol">&infin;</td>
    <td>Infinity</td>
  </tr>

</table>

</main>

</body>
</html>
