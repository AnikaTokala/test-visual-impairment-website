<!DOCTYPE html>
<html>
<head>
    <title>MathReader</title>
    <link href="./style.css" rel="stylesheet">
</head>
<body>
    <h1>MathReader</h1>
</body>
</html>

<style>
body {
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}

table {
  border-collapse: collapse;
  width: 60%;
  font-family: "Times New Roman", serif;
  color: #fbf3ea;
}

th, td {
  border: 1px solid #ccc;
  padding: 10px;
  text-align: center;
}

th {
  background-color: #f4f4f4;
}

.symbol {
  font-size: 24px;
}
</style>

<table>
  <tr>
    <th>Symbol</th>
    <th>Name</th>
  </tr>

  <tr>
    <td class="symbol">&plusmn;</td>
    <td>Plus Minus</td>
  </tr>

  <tr>
    <td class="symbol">&times;</td>
    <td>Multiplication</td>
  </tr>

  <tr>
    <td class="symbol">&divide;</td>
    <td>Division</td>
  </tr>

  <tr>
    <td class="symbol">&le;</td>
    <td>Less Than or Equal</td>
  </tr>

  <tr>
    <td class="symbol">&ge;</td>
    <td>Greater Than or Equal</td>
  </tr>

  <tr>
    <td class="symbol">&infin;</td>
    <td>Infinity</td>
  </tr>

</table>
</html>
